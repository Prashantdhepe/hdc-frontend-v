server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 🔴 FIRST: Laravel backend routes (Filament + API + Assets)
    location ^~ /admin {
        proxy_pass http://hdc-api-service:80;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api {
        proxy_pass http://hdc-api-service:80;
        include /etc/nginx/proxy_params;
    }

    location ^~ /livewire {
        proxy_pass http://hdc-api-service:80;
        include /etc/nginx/proxy_params;
    }

    location ^~ /vendor {
        proxy_pass http://hdc-api-service:80;
        include /etc/nginx/proxy_params;
    }

    location ^~ /storage {
        proxy_pass http://hdc-api-service:80;
        include /etc/nginx/proxy_params;
    }

    # 🟢 LAST: Vue SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}



